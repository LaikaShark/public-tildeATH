[project]
name = "athc"
version = "0.0.1"
description = "Compiler for the ~ATH esoteric language"
requires-python = ">=3.10"
dependencies = [
    "llvmlite>=0.42",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
athc = "athc.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["athc*"]

[tool.setuptools.package-data]
athc = ["_runtime/*", "_stdlib/*.ath"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
